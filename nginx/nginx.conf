# ============================================================
# Nginx 前端静态托管配置 —— 多校学生积分管理平台
#
# 部署步骤：
#   1. 本地前端项目：npm run build
#      产出 frontend/dist/
#   2. 上传到服务器：
#         scp -r frontend/dist/* root@服务器:/var/www/frontend/
#      或直接 rsync / sftp / WinSCP
#   3. 把本文件放到服务器：/etc/nginx/conf.d/supabase-console.conf
#      或替换 /etc/nginx/nginx.conf 里的 server 块
#   4. 校验 + reload：
#         nginx -t && nginx -s reload
#   5. 浏览器访问 http://服务器IP/ 即可
#
# 如需局域网外访问：
#   - 确保服务器防火墙开放 80 端口
#   - 建议配 HTTPS（certbot + let's encrypt）
# ============================================================

server {
    listen       80;
    server_name  _;

    # 前端构建产物存放路径
    # 本地开发用：把 frontend/dist/ 里全部文件拷到这里
    root   /var/www/frontend;
    index  index.html;

    # ----------------------------------------------------------
    # Vue Router history 模式必需 —— 所有未匹配文件都回退到 index.html
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（方便前端重新部署后刷新即生效）
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ----------------------------------------------------------
    # 静态资源长期缓存 —— Vite 构建产物文件名带 hash，放心缓存
    # ----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # favicon / icons / 其他根目录静态资源
    location ~* \.(?:ico|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ----------------------------------------------------------
    # （可选）把 /api 代理到 Supabase Kong —— 前端也可直接访问 Kong 端口
    # 如果你在前端 .env.local 里填的是 VITE_SUPABASE_URL=http://127.0.0.1:8000
    # 那这段可以注释掉；内网部署推荐前端直连 Kong 端口（更简单）
    # ----------------------------------------------------------
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:8000/;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ----------------------------------------------------------
    # 健康检查
    # ----------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 禁止隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
