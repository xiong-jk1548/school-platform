# ============================================================
# Supabase 自托管（精简版）— 多校学生积分管理平台
# 参考 supabase-community/supabase-docker-compose，简化到最小可用
#
# 使用步骤：
#   1. 复制 .env.example 为 .env，修改里面所有密钥和密码
#   2. 首次启动（会初始化数据库）：
#         docker compose up -d
#   3. 访问 Supabase 服务：
#         REST API:   http://127.0.0.1:8000/rest/v1/
#         Auth API:   http://127.0.0.1:8000/auth/v1/
#         SQL 编辑：  浏览器打开 http://127.0.0.1:8000 即可进入 Supabase Dashboard
#         或在 postgres 容器里用 psql 执行：
#             docker exec -it supabase-db psql -U postgres -d postgres
#   4. 首次初始化业务表：执行 docker/init/01_schema.sql → 02_features_v2.sql
#   5. 停止：docker compose down
#      重启：docker compose restart
#      查看日志：docker compose logs -f
#
# 安全说明：
#   - 端口只绑定 127.0.0.1，不会暴露到公网 / 其他内网机器
#   - 如需局域网内其他机器访问 REST API，请把 ports 改成 "8000:8000"（去掉 127.0.0.1 前缀）
#   - 部署前务必替换 .env 中所有密钥，禁止使用默认值！
# ============================================================

name: supabase

networks:
  supabase:
    driver: bridge

services:
  # ----------------------------------------------------------
  # 数据库 —— PostgreSQL 15
  # ----------------------------------------------------------
  db:
    container_name: supabase-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # 定时备份脚本会备份到这个 volume，由 scripts/backup-db.sh 挂载到此容器
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase

  # ----------------------------------------------------------
  # PostgREST —— 自动生成 REST API
  # ----------------------------------------------------------
  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://supabase:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    networks:
      - supabase

  # ----------------------------------------------------------
  # GoTrue —— 认证服务（账号密码登录）
  # ----------------------------------------------------------
  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.160.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DATABASE_URL: postgres://supabase:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_ANON_KEY: ${SUPABASE_ANON_KEY}
      GOTRUE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      # 关闭邮箱确认（内网，手动创建账号即可）；如需强制验证改成 true
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_EMAIL_CONFIRMATION_REQUIRED: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: 127.0.0.1
      GOTRUE_SMTP_PORT: 25
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: "Supabase Auth"
      GOTRUE_SMTP_SENDER_EMAIL: "admin@example.com"
    networks:
      - supabase

  # ----------------------------------------------------------
  # Storage —— MinIO 对象存储（暂不强制使用，保留以兼容 Supabase SDK）
  # ----------------------------------------------------------
  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: s3
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      S3_PROTOCOL: http
      S3_HOST: storage-minio:9000
      S3_BUCKET: supabase
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      STORAGE_S3_PUT_OBJECT_MAP_URL: http://storage-minio:9000
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - supabase

  storage-minio:
    container_name: supabase-storage-minio
    image: minio/minio:RELEASE.2024-02-09T21-25-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - supabase-minio-data:/data
    networks:
      - supabase

  # ----------------------------------------------------------
  # Kong —— API 网关，把 auth / rest / storage 统一暴露
  # ----------------------------------------------------------
  kong:
    container_name: supabase-kong
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - rest
      - auth
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./kong.yml:/tmp/kong.yml:ro
    # 端口只绑定 127.0.0.1 —— 禁止公网直接访问
    # 如需局域网访问，把 "127.0.0.1:8000:8000" 改成 "8000:8000"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
    networks:
      - supabase

volumes:
  supabase-db-data:
  supabase-storage-data:
  supabase-minio-data:
