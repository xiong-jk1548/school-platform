# 离线镜像内生效的前端站点配置
# Dockerfile.offline: COPY deploy/nginx.conf /etc/nginx/conf.d/default.conf
# 覆盖 nginx:alpine 自带的 default.conf，站点根目录换成镜像里 COPY 进去的
# /usr/share/nginx/html（即 frontend/dist 的构建产物）。
# 改完必须 docker build -f Dockerfile.offline ... 重建镜像才生效，改源文件不起作用。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩（前端产物里 js/css 体积大，内网带宽有限，压缩收益明显）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Vue Router history 模式 fallback —— 任何未匹配到静态文件的请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源加 7 天缓存（Vite 产物文件名带 hash，内容变则文件名变，可以放心缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 不回显 nginx 版本号，减少探测信息
    server_tokens off;
}
